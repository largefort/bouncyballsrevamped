<!DOCTYPE html>
<html>
<head>
    <title>Bouncy Balls Empire</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            font-family: Arial, sans-serif;
        }

        #ball {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            transition: transform 0.1s ease-out;
        }

        .trail {
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            opacity: 0.5;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }

        #tutorial {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 5, 5, 0.5);
            color: white;
            font-size: 20px;
            padding: 20px;
            z-index: 100;
        }

        #scoreboard {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 18px;
            text-align: right;
        }

        #coinDisplay {
            position: absolute;
            top: 50px;
            right: 10px;
            color: white;
            font-size: 18px;
            text-align: right;
        }

        #loadingScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #loadingText {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 80%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            background-color: #4caf50;
            transition: width 0.3s ease;
            text-align: center;
            line-height: 20px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="loadingScreen">
    <div id="loadingText">Loading index.html...</div>
    <div class="progress-bar">
        <div id="progress" class="progress-bar-inner">0 KB / -- KB</div>
    </div>
</div>
<div id="ball"></div>
<div id="tutorial">
    <p>Welcome to Bouncy Balls Empire!</p>
    <p>Click on the button to spawn new bouncing balls!</p>
    <p>Each ball earns you coins with every bounce!</p>
    <p>Click anywhere to continue.</p>
</div>
<div id="scoreboard">Bounces: <span id="bounces">0</span></div>
<div id="coinDisplay">Coins: <span id="coins">0</span></div>
<button id="spawnButton">Spawn Ball (+1 Red Ball)</button>
<audio id="bounceSound" src="https://www.soundjay.com/button/beep-07.wav"></audio>
<audio id="trailSound" src="https://www.soundjay.com/button/beep-05.wav"></audio>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var ball = document.getElementById('ball');
        var tutorial = document.getElementById('tutorial');
        var scoreboard = document.getElementById('bounces');
        var coinDisplay = document.getElementById('coins');
        var bounceSound = document.getElementById('bounceSound');
        var trailSound = document.getElementById('trailSound');
        var spawnButton = document.getElementById('spawnButton');
        var x = window.innerWidth / 2;
        var y = window.innerHeight / 2;
        var xDirection = 1;
        var yDirection = 1;
        var xSpeed = 1;
        var ySpeed = 1;
        var bounces = 0;
        var coins = 0;

        // Load game state from local storage
        if (localStorage.getItem('bounces')) {
            bounces = parseInt(localStorage.getItem('bounces'));
            scoreboard.textContent = bounces;
        }
        if (localStorage.getItem('coins')) {
            coins = parseInt(localStorage.getItem('coins'));
            coinDisplay.textContent = coins;
        }

        function createTrail(x, y) {
            var trail = document.createElement('div');
            trail.classList.add('trail');
            trail.style.left = x + 'px';
            trail.style.top = y + 'px';
            document.body.appendChild(trail);
            setTimeout(function() {
                trail.style.transform = 'scale(0)';
                trail.style.opacity = '0';
            }, 50);
            setTimeout(function() {
                trail.parentNode.removeChild(trail);
            }, 500);
            trailSound.play();
        }

        function moveBall() {
            x += xDirection * xSpeed;
            y += yDirection * ySpeed;

            if (x > window.innerWidth - 50 || x < 0) {
                xDirection *= -1;
                createTrail(x, y);
                bounces++;
                coins++;
                scoreboard.textContent = bounces;
                coinDisplay.textContent = coins;
                bounceSound.play();
            }
            if (y > window.innerHeight - 50 || y < 0) {
                yDirection *= -1;
                createTrail(x, y);
                bounces++;
                coins++;
                scoreboard.textContent = bounces;
                coinDisplay.textContent = coins;
                bounceSound.play();
            }

            ball.style.left = x + 'px';
            ball.style.top = y + 'px';

            // Save game state to local storage
            localStorage.setItem('bounces', bounces);
            localStorage.setItem('coins', coins);
        }

        function handleClick() {
            xSpeed = Math.random() * 2 + 1;
            ySpeed = Math.random() * 2 + 1;
            ball.style.backgroundColor = getRandomColor();
        }

        function getRandomColor() {
            var letters = '0123456789ABCDEF';
            var color = '#';
            for (var i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function disableFingerZooming() {
            document.addEventListener('touchmove', function(event) {
                if (event.scale !== 1) {
                    event.preventDefault();
                }
            }, { passive: false });
        }

        function loadFile(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === XMLHttpRequest.DONE) {
                    if (xhr.status === 200) {
                        callback(xhr.responseText);
                    }
                }
            };
            xhr.open('GET', url, true);
            xhr.send();
        }

        function updateLoadingText(text) {
            document.getElementById('loadingText').textContent = text;
        }

        function updateProgressBar(loadedBytes, totalBytes) {
            var progressText = loadedBytes + ' KB / ' + totalBytes + ' KB';
            var progressPercentage = (loadedBytes / totalBytes) * 100;
            document.getElementById('progress').textContent = progressText;
            document.getElementById('progress').style.width = progressPercentage + '%';
        }

        loadFile('index.html', function(responseText) {
            var totalBytes = (responseText.length / 1024).toFixed(2);
            updateProgressBar(0, totalBytes);
            updateLoadingText('Loading ball physics...');
            setTimeout(function() {
                updateProgressBar(totalBytes, totalBytes);
                updateLoadingText('Drawing ball...');
                setTimeout(function() {
                    updateLoadingText('Drawing animated trail effect...');
                    setTimeout(function() {
                        document.getElementById('loadingScreen').style.display = 'none';
                        setInterval(moveBall, 10);
                    }, 2000);
                }, 2000);
            }, 2000);
        });

        ball.addEventListener('click', handleClick);
        tutorial.addEventListener('click', function() {
            document.body.removeChild(tutorial);
        });

        spawnButton.addEventListener('click', function() {
            createBall();
        });

        function createBall() {
            var extraBall = document.createElement('div');
            extraBall.classList.add('extraBall');
            extraBall.style.width = '50px';
            extraBall.style.height = '50px';
            extraBall.style.backgroundColor = getRandomColor();
            extraBall.style.borderRadius = '50%';
            extraBall.style.position = 'absolute';
            extraBall.style.left = Math.random() * (window.innerWidth - 50) + 'px';
            extraBall.style.top = Math.random() * (window.innerHeight - 50) + 'px';
            document.body.appendChild(extraBall);

            setInterval(function() {
                extraBall.style.left = Math.random() * (window.innerWidth - 50) + 'px';
                extraBall.style.top = Math.random() * (window.innerHeight - 50) + 'px';
                createTrail(parseFloat(extraBall.style.left), parseFloat(extraBall.style.top));
            }, 1000);
        }

        disableFingerZooming();
    });
</script>
</body>
</html>
